name: CI–FastAPI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # (c) Job séparé pour la sécurité, (b) exécuté EN PREMIER
  security:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install safety
        run: pip install safety==1.10.3
      # (b) Vérification des vulnérabilités des dépendances
      - name: Check dependencies security
        run: safety check || true

  test:
    runs-on: ubuntu-24.04
    needs: security          # (d) test ne démarre QUE si security a réussi
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip list
      # (a) Tests AVEC mesure de la couverture
      - name: Run tests + coverage
        run: |
          export PYTHONPATH=$(pwd)
          pytest --maxfail=1 --disable-warnings -q --cov=app --cov-report=term-missing